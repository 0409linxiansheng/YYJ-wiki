<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>云屿集 · 内容管理</title>
<style>
  :root { --bg:#fafaf9; --panel:#ffffff; --line:#e5e7eb; --fg:#1f2328; --muted:#6b7280; --brand:#3b5bdb; --ok:#22a06b; --warn:#e0a13c; --err:#e05c5c; }
  * { box-sizing: border-box; }
  body { margin:0; font:14px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; background:var(--bg); color:var(--fg); height:100vh; display:flex; flex-direction:column; }
  button { font:inherit; cursor:pointer; border:1px solid var(--line); background:var(--panel); color:var(--fg); border-radius:8px; padding:6px 12px; }
  button:hover { border-color:#3a4152; }
  button.primary { background:var(--brand); border-color:var(--brand); color:#fff; }
  button.danger { color:var(--err); }
  input, select, textarea { font:inherit; background:var(--bg); color:var(--fg); border:1px solid var(--line); border-radius:8px; padding:6px 10px; }
  textarea { width:100%; height:100%; resize:none; border:none; padding:16px; font-family:ui-monospace,Menlo,Consolas,monospace; font-size:13px; line-height:1.7; background:var(--panel); outline:none; }
  .hidden { display:none !important; }

  /* 登录 */
  #login { margin:auto; width:320px; background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:28px; }
  #login h1 { font-size:18px; margin:0 0 6px; }
  #login p { color:var(--muted); margin:0 0 18px; font-size:13px; }
  #login input { width:100%; margin-bottom:12px; }
  #login button { width:100%; }

  /* 主框架 */
  #app { flex:1; display:flex; flex-direction:column; min-height:0; }
  header { display:flex; align-items:center; gap:10px; padding:10px 16px; border-bottom:1px solid var(--line); background:var(--panel); }
  header .brand { font-weight:600; margin-right:auto; }
  main { flex:1; display:flex; min-height:0; }
  aside { width:260px; border-right:1px solid var(--line); overflow:auto; padding:10px; background:var(--panel); }
  .group { margin-bottom:14px; }
  .group > .title { color:var(--muted); font-size:12px; padding:4px 8px; text-transform:uppercase; letter-spacing:.06em; }
  .item { padding:6px 10px; border-radius:8px; cursor:pointer; display:flex; gap:6px; align-items:center; }
  .item:hover { background:#f1f3f8; }
  .item.active { background:#e8edff; }
  .item .del { margin-left:auto; color:var(--muted); visibility:hidden; }
  .item:hover .del { visibility:visible; }

  section.editor { flex:1; display:flex; flex-direction:column; min-width:0; }
  .meta { display:flex; gap:10px; align-items:center; padding:10px 16px; border-bottom:1px solid var(--line); }
  .meta input { flex:1; }
  .toolbar { display:flex; flex-wrap:wrap; gap:6px; padding:8px 16px; border-bottom:1px solid var(--line); }
  .toolbar button { padding:4px 9px; font-size:13px; }
  .split { flex:1; display:flex; min-height:0; }
  .split .pane { flex:1; min-width:0; display:flex; flex-direction:column; }
  .split .pane + .pane { border-left:1px solid var(--line); }
  iframe { flex:1; width:100%; border:none; background:#fff; }
  .status { padding:8px 16px; border-top:1px solid var(--line); color:var(--muted); font-size:12px; display:flex; gap:12px; }
  .status .ok { color:var(--ok); } .status .err { color:var(--err); }

  /* 弹窗 */
  .modal { position:fixed; inset:0; background:rgba(0,0,0,.55); display:flex; align-items:center; justify-content:center; z-index:50; }
  .modal .box { width:min(720px,92vw); max-height:82vh; overflow:auto; background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:20px; }
  .modal h2 { margin:0 0 14px; font-size:16px; }
  .modal .row { margin-bottom:12px; display:flex; gap:10px; }
  .modal .row label { width:70px; color:var(--muted); }
  .modal .row input, .modal .row select, .modal .row textarea { flex:1; }
  .modal textarea { height:340px; border:1px solid var(--line); border-radius:8px; }
  .hist-item { padding:10px; border:1px solid var(--line); border-radius:8px; margin-bottom:8px; display:flex; gap:10px; align-items:center; }
  .hist-item small { color:var(--muted); }
  .empty { color:var(--muted); text-align:center; padding:40px; }
  /* 提示条 */
  #toasts { position:fixed; right:16px; bottom:16px; display:flex; flex-direction:column; gap:8px; z-index:99; }
  .toast { background:var(--panel); border:1px solid var(--line); border-left:3px solid var(--brand); padding:10px 14px; border-radius:8px; box-shadow:0 10px 30px rgba(0,0,0,.4); min-width:200px; max-width:360px; font-size:13px; animation:toastIn .18s ease; }
  .toast.ok { border-left-color:var(--ok); } .toast.err { border-left-color:var(--err); }
  @keyframes toastIn { from { opacity:0; transform:translateY(8px); } }
  /* 搜索框 */
  #treeSearch { width:100%; margin-bottom:10px; }
  /* 侧栏层级 */
  .group > .title { display:flex; justify-content:space-between; align-items:center; }
  .group > .title .count { color:var(--muted); font-size:11px; }
  .item.active { box-shadow:inset 3px 0 0 var(--brand); }
  .item .name { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  /* 工具栏分组 */
  .toolbar .sep { width:1px; background:var(--line); margin:2px 4px; align-self:stretch; }
  /* 加载 */
  .loading { display:inline-block; width:12px; height:12px; border:2px solid var(--line); border-top-color:var(--brand); border-radius:50%; animation:spin .7s linear infinite; vertical-align:-2px; }
  @keyframes spin { to { transform:rotate(360deg); } }
  /* 块编辑器 */
  .be-toolbar { display:flex; flex-wrap:wrap; gap:6px; padding:10px 14px; justify-content:center; border-bottom:1px solid var(--line); position:sticky; top:0; background:var(--panel); z-index:2; }
  .be-toolbar button { font-size:13px; padding:4px 9px; }
  .be-area { max-width:760px; margin:0 auto; padding:28px 32px 120px; font-size:15.5px; line-height:1.85; }
  .be-wrap { position:relative; margin:2px 0; }
  .be-wrap:hover { background:#f7f8fb; }
  .be-actions { position:absolute; right:4px; top:2px; display:none; gap:2px; }
  .be-wrap:hover .be-actions { display:flex; }
  .be-actions button { padding:1px 6px; font-size:12px; opacity:.8; }
  .be-text { outline:none; min-height:1.4em; white-space:pre-wrap; }
  .be-text:empty:before { content:attr(data-placeholder); color:#b0b6c3; }
  .be-heading { font-weight:650; line-height:1.3; }
  .be-h1 { font-size:32px; } .be-h2 { font-size:24px; } .be-h3 { font-size:19px; } .be-h4 { font-size:16px; }
  .be-para { font-size:15.5px; line-height:1.85; }
  .be-code { border:1px solid var(--line); border-radius:10px; overflow:hidden; margin:8px 0; }
  .be-code-bar { display:flex; gap:8px; align-items:center; padding:6px 10px; background:#f6f8fa; border-bottom:1px solid var(--line); }
  .be-lang { width:90px; padding:2px 6px; font-size:12px; }
  .be-code-title { color:var(--muted); font-size:12px; }
  .be-code-body { margin:0; padding:12px 14px; background:#f6f8fa; border-top:1px solid var(--line); overflow:auto; }
  .be-code-inner { outline:none; white-space:pre; font-family:ui-monospace,Menlo,Consolas,monospace; font-size:13px; line-height:1.7; color:#1f2328; }
  .be-adm { border-left:4px solid var(--brand); background:rgba(79,107,237,.08); border-radius:8px; padding:10px 14px; margin:8px 0; }
  .be-adm-tip { border-color:#22a06b; background:rgba(34,160,107,.08); }
  .be-adm-info { border-color:#0ea5e9; background:rgba(14,165,233,.08); }
  .be-adm-caution { border-color:#e0a13c; background:rgba(224,161,60,.10); }
  .be-adm-warning { border-color:#e07a3c; background:rgba(224,122,60,.10); }
  .be-adm-danger { border-color:#e05c5c; background:rgba(224,92,92,.10); }
  .be-adm-head { display:flex; gap:8px; align-items:center; margin-bottom:4px; }
  .be-adm-kind { width:96px; padding:1px 4px; font-size:12px; }
  .be-adm-title { font-weight:650; }
  .be-table table { border-collapse:collapse; width:100%; }
  .be-table th, .be-table td { border:1px solid var(--line); padding:6px 10px; min-width:60px; outline:none; }
  .be-table th { background:#f6f8fa; font-weight:600; }
  .be-table-tools { display:flex; gap:8px; margin-top:6px; }
  .be-list-row { display:flex; gap:8px; align-items:flex-start; }
  .be-bullet { color:var(--muted); min-width:18px; }
  .be-add { margin-top:4px; font-size:12px; padding:2px 8px; }
  .be-quote { border-left:3px solid var(--line); padding-left:12px; color:#57606a; }
  .be-image img { max-width:100%; border-radius:8px; margin-bottom:8px; }
  .be-image-row { display:flex; gap:8px; }
  .be-details { border:1px solid var(--line); border-radius:8px; padding:10px 12px; }
  .be-details-sum { font-weight:600; }
  .be-details-body { color:var(--muted); margin-top:6px; }
  .be-raw { border:1px dashed var(--line); border-radius:8px; padding:8px 10px; }
  .be-raw-tag { font-size:11px; color:var(--muted); margin-bottom:4px; }
  .be-raw-body { font-family:ui-monospace,Menlo,Consolas,monospace; font-size:12px; color:#57606a; }
  .be-empty { color:var(--muted); text-align:center; padding:60px 0; }
  .toc-pane { width:220px; flex:0 0 220px; border-left:1px solid var(--line); background:var(--panel); overflow:auto; padding:14px 12px; }
  .toc-title { color:var(--muted); font-size:12px; letter-spacing:.06em; margin-bottom:8px; }
  .toc-item { padding:4px 8px; border-radius:6px; cursor:pointer; font-size:13px; color:#40474f; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .toc-item:hover { background:#f1f3f8; }
  .toc-item.lv2 { padding-left:16px; } .toc-item.lv3 { padding-left:26px; color:var(--muted); } .toc-item.lv4 { padding-left:36px; color:var(--muted); }
  .toc-empty { color:var(--muted); font-size:12px; padding:8px; }
  @media (max-width: 1100px) { .toc-pane { display:none; } }
  @media (max-width: 820px) {
    main { flex-direction: column; }
    aside { width:100%; max-height:28vh; border-right:none; border-bottom:1px solid var(--line); }
    .split { flex-direction:column; }
    .split .pane + .pane { border-left:none; border-top:1px solid var(--line); }
    header { flex-wrap:wrap; }
    .toolbar { overflow-x:auto; flex-wrap:nowrap; }
    .modal .row { flex-direction:column; }
    .modal .row label { width:auto; }
  }
  .tabs { display:flex; gap:6px; margin-bottom:16px; flex-wrap:wrap; }
  .tabs button.active { background:var(--brand); border-color:var(--brand); color:#fff; }
  .list-row { display:flex; gap:8px; margin-bottom:8px; align-items:center; }
  .list-row input { flex:1; }
  .field { margin-bottom:12px; }
  .field label { display:block; color:var(--muted); font-size:12px; margin-bottom:4px; }
  .field input, .field textarea { width:100%; }
  .field textarea { height:140px; }
</style>
<script type="module">
  import {parseMarkdown, serializeBlocks} from '/blocks.js';
  window.Blocks = {parseMarkdown, serializeBlocks};
  window.dispatchEvent(new Event('blocks-ready'));
</script>
<script defer src="/block-editor.js"></script>
</head>
<body>

<!-- 登录 -->
<div id="login" class="hidden">
  <h1 id="loginTitle">云屿集 · 内容管理</h1>
  <p id="loginHint"></p>
  <input id="password" type="password" placeholder="密码" autocomplete="current-password" />
  <button class="primary" id="loginBtn">进入</button>
</div>

<!-- 主界面 -->
<div id="app" class="hidden">
  <header>
    <span class="brand">云屿集 · 内容管理</span>
    <button id="btnNew">+ 新建</button>
    <button id="btnHistory">历史</button>
    <button id="btnSettings">站点设置</button>
    <button id="btnAssets">图片库</button>
    <button id="btnLogout">退出</button>
    <button class="primary" id="btnPublish">发布到 GitHub</button>
  </header>
  <main>
    <aside>
      <input id="treeSearch" placeholder="搜索文章…" />
      <div id="tree"></div>
    </aside>
    <section class="editor">
      <div class="meta">
        <span style="color:var(--muted)" id="currentPath">未选择文章</span>
        <button id="btnPublishDraft" class="hidden">发布这篇草稿</button>
        <button id="btnFileHistory">本文历史</button>
        <button id="btnMode">切换源码</button>
        <button id="btnRefreshPreview">刷新预览</button>
        <button id="btnRename" style="margin-left:auto">重命名</button>
        <button id="btnPreviewDev">打开开发服务器</button>
      </div>
      <div class="toolbar" id="toolbar">
        <button data-ins="h2" title="插入二级标题">标题</button>
        <button data-ins="bold"><b>B</b></button>
        <button data-ins="italic"><i>I</i></button>
        <button data-ins="code">行内代码</button>
        <button data-ins="codeblock">代码块</button>
        <span class="sep"></span>
        <button data-ins="table">表格</button>
        <button data-ins="tip">提示框</button>
        <button data-ins="tabs">标签页</button>
        <button data-ins="mermaid">Mermaid</button>
        <button data-ins="math">公式</button>
        <button data-ins="footnote">脚注</button>
        <button data-ins="details">折叠块</button>
        <span class="sep"></span>
        <button data-ins="link">链接</button>
        <button data-ins="image">图片</button>
      </div>
      <div id="draftBanner" class="hidden" style="display:flex;gap:10px;align-items:center;padding:8px 16px;background:#2a2416;border-bottom:1px solid #4a3d1a;font-size:13px">
        <span style="color:#e0a13c">发现上次未保存的本地草稿</span>
        <button id="btnRestoreDraft">恢复草稿</button>
        <button id="btnDiscardDraft">忽略</button>
      </div>
      <div id="blockPane" class="pane" style="display:none;overflow:auto;background:#fff"></div>
      <div class="split">
        <div class="pane"><textarea id="editor" placeholder="选择左侧文章，或点「新建」开始写作"></textarea></div>
        <div class="pane" style="position:relative">
          <iframe id="preview" src="about:blank" onload="document.getElementById('previewMask').style.display='none'"></iframe>
          <div id="previewMask" style="position:absolute;inset:0;display:flex;flex-direction:column;gap:8px;align-items:center;justify-content:center;background:#fff;color:#6b7280;font-size:13px">
            <span class="loading"></span>
            <span id="previewMaskText">预览加载中…</span>
            <div style="display:flex;gap:10px">
              <button id="btnLoadPreview">加载预览</button>
              <a id="previewOpen" href="#" target="_blank" style="color:#4f6bed;font-size:12px;align-self:center">在新标签页打开</a>
            </div>
          </div>
        </div>
      </div>
      <div class="status">
        <span id="statusText">就绪</span>
        <label style="display:flex;align-items:center;gap:6px;margin-left:auto"><input type="checkbox" id="chkBuild"> 发布前构建校验</label>
        <span id="dirtyFlag"></span>
        <button id="btnSave">保存</button>
      </div>
    </section>
    <aside id="tocPane" class="toc-pane">
      <div class="toc-title">目录</div>
      <div id="tocList"></div>
    </aside>
  </main>
</div>

<!-- 新建 -->
<div class="modal hidden" id="modalNew"><div class="box">
  <h2>新建</h2>
  <div class="row"><label>类型</label><select id="newKind"><option value="doc">知识库文章</option><option value="blog">博客</option></select></div>
  <div class="row" id="rowCategory"><label>分类</label><select id="newCategory"></select></div>
  <div class="row"><label>标题</label><input id="newTitle" placeholder="文章标题" /></div>
  <div class="row"><label>文件名</label><input id="newSlug" placeholder="留空自动生成" /></div>
  <div class="row" id="rowDraft"><label>草稿</label><label style="display:flex;align-items:center;gap:6px"><input type="checkbox" id="newDraft"> 先存为草稿，不发布</label></div>
  <div style="text-align:right"><button id="btnNewCancel">取消</button> <button class="primary" id="btnNewOk">创建</button></div>
</div></div>

<!-- 历史 -->
<div class="modal hidden" id="modalHistory"><div class="box">
  <h2>发布历史</h2>
  <div id="historyList"></div>
  <div style="text-align:right;margin-top:12px"><button id="btnHistoryClose">关闭</button></div>
</div></div>

<!-- 设置 -->
<div class="modal hidden" id="modalSettings"><div class="box" style="width:min(880px,94vw)">
  <h2>站点设置</h2>
  <div class="tabs" id="settingsTabs">
    <button data-tab="basic" class="active">基本信息</button>
    <button data-tab="nav">导航栏</button>
    <button data-tab="cat">分类</button>
    <button data-tab="social">社交</button>
    <button data-tab="home">首页</button>
    <button data-tab="footer">页脚</button>
  </div>
  <div id="settingsBody" style="min-height:320px"></div>
  <div style="text-align:right;margin-top:14px">
    <button id="btnSettingsClose">取消</button>
    <button class="primary" id="btnSettingsSave">保存</button>
  </div>
</div></div>

<input type="file" id="imgFile" accept="image/*" hidden />

<div class="modal hidden" id="modalAssets"><div class="box" style="width:min(880px,94vw)">
  <h2>图片库</h2>
  <div id="assetsList"></div>
  <div style="text-align:right;margin-top:12px"><button id="btnAssetsClose">关闭</button></div>
</div></div>

<div class="modal hidden" id="modalFileHistory"><div class="box" style="width:min(760px,94vw)">
  <h2>本文历史</h2>
  <div id="fileHistoryList"></div>
  <div style="text-align:right;margin-top:12px"><button id="btnFileHistoryClose">关闭</button></div>
</div></div>

<div id="toasts"></div>
<script>
const DEV_PORT = 3001;
const state = {docs: [], blog: [], drafts: [], categories: {}, current: null, dirty: false};
const $ = (id) => document.getElementById(id);

async function api(path, opts = {}) {
  const res = await fetch(path, {
    credentials: 'same-origin',
    headers: {'Content-Type': 'application/json'},
    ...opts,
  });
  const data = await res.json().catch(() => ({}));
  if (res.status === 401) { showLogin(true); throw new Error('未登录'); }
  return data;
}

function status(text, kind) {
  const el = $('statusText');
  el.textContent = text;
  el.className = kind || '';
}

function toast(message, kind) {
  const el = document.createElement('div');
  el.className = 'toast ' + (kind || 'ok');
  el.textContent = message;
  $('toasts').appendChild(el);
  setTimeout(() => {
    el.style.transition = 'opacity .2s';
    el.style.opacity = '0';
    setTimeout(() => el.remove(), 220);
  }, 2600);
}

/* ---------- 登录 ---------- */
function showLogin(needsSetup) {
  $('app').classList.add('hidden');
  $('login').classList.remove('hidden');
  $('loginHint').textContent = needsSetup ? '首次使用，请设置一个管理密码（至少 4 位）' : '请输入密码';
  $('loginBtn').textContent = needsSetup ? '设置密码并进入' : '进入';
  $('loginBtn').dataset.setup = needsSetup ? '1' : '';
}

$('loginBtn').onclick = async () => {
  const password = $('password').value;
  const setup = $('loginBtn').dataset.setup === '1';
  const data = await api(setup ? '/api/setup' : '/api/login', {method: 'POST', body: JSON.stringify({password})});
  if (data.error) { $('loginHint').textContent = data.error; return; }
  boot();
};

/* ---------- 启动 ---------- */
async function boot() {
  const data = await api('/api/state');
  if (data.needsSetup) return showLogin(true);
  if (!data.authed) return showLogin(false);
  state.docs = data.docs; state.blog = data.blog; state.drafts = data.drafts || []; state.categories = data.categories || {};
  $('login').classList.add('hidden');
  $('app').classList.remove('hidden');
  renderTree();
  fillCategories();
  applyMode();
  api('/api/dev/start', {method: 'POST'}).catch(() => {});
  status('已登录 · ' + (data.site.title || ''));
}

/* ---------- 目录树 ---------- */
let treeQuery = '';
let previewActive = false;
let pendingDraft = null;
function renderTree() {
  const q = treeQuery.trim().toLowerCase();
  const match = (it) => !q || it.title.toLowerCase().includes(q) || it.path.toLowerCase().includes(q);
  const groups = {};
  for (const d of state.docs) if (match(d)) (groups[d.category] ||= []).push(d);
  let html = '';
  for (const [cat, items] of Object.entries(groups)) {
    const label = state.categories[cat]?.label || cat;
    html += `<div class="group"><div class="title"><span>${label}</span><span class="count">${items.length}</span></div>`;
    for (const it of items) {
      html += `<div class="item ${state.current?.path === it.path ? 'active' : ''}" data-path="${it.path}" data-kind="doc">
        <span>${it.title}</span><span class="del" data-del="${it.path}">✕</span></div>`;
    }
    html += '</div>';
  }
  if (state.drafts.length) {
    html += `<div class="group"><div class="title">草稿（未发布）</div>`;
    for (const it of state.drafts) {
      if (!match(it)) continue;
      html += `<div class="item ${state.current?.path === it.path ? 'active' : ''}" data-path="${it.path}" data-kind="draft">
        <span>${it.title}</span><span class="del" data-del="${it.path}">✕</span></div>`;
    }
    html += '</div>';
  }
  if (state.blog.length) {
    html += `<div class="group"><div class="title">博客</div>`;
    for (const it of state.blog) {
      if (!match(it)) continue;
      html += `<div class="item ${state.current?.path === it.path ? 'active' : ''}" data-path="${it.path}" data-kind="blog">
        <span>${it.title}</span><span class="del" data-del="${it.path}">✕</span></div>`;
    }
    html += '</div>';
  }
  $('tree').innerHTML = html || '<div class="empty">还没有文章</div>';
}

$('tree').onclick = async (e) => {
  const del = e.target.closest('[data-del]');
  if (del) {
    if (!confirm('确定删除这篇文章？（发布后才会真正删除线上）')) return;
    await api('/api/doc/delete', {method: 'POST', body: JSON.stringify({path: del.dataset.del})});
    const data = await api('/api/state');
    state.docs = data.docs; state.blog = data.blog; state.drafts = data.drafts || []; state.categories = data.categories || {}; renderTree();
    return;
  }
  const item = e.target.closest('[data-path]');
  if (!item) return;
  await openDoc(item.dataset.path);
};

async function openDoc(path, force) {
  if (!force && state.dirty && state.current && state.current.path !== path) {
    if (!window.confirm('当前文章还有未保存的修改，确定要切换吗？')) return;
  }
  $('statusText').innerHTML = '<span class="loading"></span> 加载中…';
  const data = await api('/api/doc?path=' + encodeURIComponent(path));
  state.current = {path, content: data.content};
  state.dirty = false;
  let content = data.content;
  const local = localStorage.getItem('yyj-draft:' + path);
  pendingDraft = local && local !== content ? local : null;
  $('draftBanner').classList.toggle('hidden', !pendingDraft);
  $('editor').value = content;
  $('currentPath').textContent = path;
  $('dirtyFlag').textContent = '';
  $('statusText').textContent = '已加载';
  $('btnPublishDraft').classList.toggle('hidden', !path.startsWith('drafts/'));
  renderTree();
  previewActive = false;
  $('preview').src = 'about:blank';
  previewActive = true;
  $('previewMask').style.display = 'flex';
  $('previewMaskText').textContent = '点「加载预览」查看真实效果（首次编译较慢）';
  $('previewOpen').href = `http://${location.hostname}:${DEV_PORT}/YYJ-wiki${routeOf(path)}`;
}

const SNIPPETS = {
  h2: () => '\n## 小标题\n',
  bold: () => '**加粗文字**',
  italic: () => '*斜体文字*',
  code: () => '`代码`',
  codeblock: () => '\n```bash\n命令\n```\n',
  table: () => '\n| 列一 | 列二 |\n| --- | --- |\n| 内容 | 内容 |\n',
  tip: () => '\n::::tip[标题]\n内容\n::::\n',
  tabs: () => '\n<Tabs>\n  <TabItem value="a" label="甲" default>内容甲</TabItem>\n  <TabItem value="b" label="乙">内容乙</TabItem>\n</Tabs>\n',
  mermaid: () => '\n```mermaid\ngraph TD\n  A[开始] --> B[结束]\n```\n',
  math: () => '\n$$\nE = mc^2\n$$\n',
  footnote: () => '文字[^1]\n\n[^1]: 脚注内容\n',

function renderToc() {
  const md = $('editor').value || '';
  const items = [...md.matchAll(/^(#{1,4})\s+(.+)$/gm)].map((m) => ({level: m[1].length, text: m[2].trim()}));
  const list = document.getElementById('tocList');
  if (!list) return;
  list.innerHTML = items.length
    ? items.map((it, idx) => `<div class="toc-item lv${it.level}" data-idx="${idx}" title="${it.text}">${it.text}</div>`).join('')
    : '<div class="toc-empty">暂无标题</div>';
}

/* ---------- 块编辑器 ---------- */
let blockMode = true;
function mountBlocks(retry) {
  if (!window.BlockEditor || !window.Blocks) {
    if (!retry) setTimeout(() => { mountBlocks(true); applyMode(); }, 300);
    return false;
  }
  const pane = document.getElementById('blockPane');
  if (!pane.dataset.mounted) {
    window.BlockEditor.mount(pane, {
      onChange: (md) => {
        $('editor').value = md;
        state.dirty = true;
        $('dirtyFlag').textContent = '未保存';
        renderToc();
      },
    });
    pane.dataset.mounted = '1';
  }
  return true;
}
function applyMode() {
  const pane = document.getElementById('blockPane');
  const split = document.querySelector('.split');
  pane.style.display = blockMode ? 'block' : 'none';
  split.style.display = blockMode ? 'none' : 'flex';
  $('btnMode').textContent = blockMode ? '切换源码' : '切换块编辑';
  if (blockMode && mountBlocks()) {
    if (state.current) window.BlockEditor.setMarkdown($('editor').value);
  }
  renderToc();
}

$('btnSave').onclick = async () => {
  if (!state.current) return;
  await api('/api/doc/save', {method: 'POST', body: JSON.stringify({path: state.current.path, content: $('editor').value})});
  state.dirty = false;
  if (state.current) localStorage.removeItem('yyj-draft:' + state.current.path);
  $('dirtyFlag').textContent = '已保存';
  toast('已保存');
  updatePreview();
};

function routeOf(path) {
  if (!path) return '/';
  if (path.startsWith('blog/')) {
    const item = state.blog.find((b) => b.path === path);
    return item ? item.route : '/blog';
  }
  const parts = path.replace(/^docs\//, '').replace(/\.mdx?$/, '').split('/');
  const name = parts.pop();
  return '/' + [...parts, name === 'index' ? '' : name].filter(Boolean).join('/');
}

async function startPreview() {
  status('正在启动预览服务…');
  const res = await api('/api/dev/start', {method: 'POST'});
  if (!res.running) { status('预览服务启动失败，请手动运行 npm start', 'err'); return; }
  status('预览已就绪', 'ok');
  updatePreview();
}

function updatePreview(retry) {
  if (!state.current) return;
  const route = routeOf(state.current.path);
  const url = `http://${location.hostname}:${DEV_PORT}/YYJ-wiki${route}?t=${Date.now()}`;
  $('previewMask').style.display = 'flex';
  $('previewMaskText').textContent = '预览加载中…（开发服务器首次编译较慢）';
  $('previewOpen').href = url;
  $('preview').src = url;
  // 新建文章时开发服务器可能还没注册路由，稍后自动重试
  if (typeof retry === 'number' && retry > 0) {
    setTimeout(() => { if (state.current) $('preview').src = url + '&r=' + retry; }, 2500);
  }
}

function field(label, key, value, ph) {
  return `<div class="field"><label>${label}</label><input data-k="${key}" value="${esc(value)}" placeholder="${esc(ph || '')}"></div>`;
}

function renderSettings() {
  const b = $('settingsBody');
  if (settingsTab === 'basic') {
    b.innerHTML =
      field('站名', 'title', cfg.title) +
      field('标语', 'tagline', cfg.tagline) +
      field('Logo 路径', 'logo', cfg.logo, '/img/logo.svg') +
      field('Favicon 路径', 'favicon', cfg.favicon, '/img/favicon.svg') +
      field('主色', 'primary', cfg.theme && cfg.theme.primary, '#3b5bdb') +
      field('SEO 描述', 'seoDescription', cfg.seo && cfg.seo.description);
  } else if (settingsTab === 'nav') {
    b.innerHTML = ((cfg.navbar || []).map((it, i) => `
      <div class="list-row">
        <input data-nav="${i}" data-f="label" value="${esc(it.label)}" placeholder="名称">
        <input data-nav="${i}" data-f="link" value="${esc(it.to || it.href || '')}" placeholder="/路径 或 https://">
        <button data-del-nav="${i}">✕</button>
      </div>`).join('') || '<div class="empty">还没有导航项</div>') +
      '<button id="addNav">+ 添加导航项</button>';
  } else if (settingsTab === 'cat') {
    b.innerHTML = Object.entries(cfg.categories || {}).map(([slug, c]) => `
      <div class="list-row" data-cat="${slug}">
        <span style="width:70px;color:var(--muted)">${slug}</span>
        <input data-cf="label" value="${esc(c.label)}" placeholder="名称">
        <input data-cf="desc" value="${esc(c.desc)}" placeholder="描述">
        <input data-cf="icon" value="${esc(c.icon)}" placeholder="图标" style="max-width:90px">
      </div>`).join('');
  } else if (settingsTab === 'social') {
    b.innerHTML =
      field('GitHub 仓库', 'github', cfg.social && cfg.social.github) +
      field('微信二维码', 'wechatQr', cfg.social && cfg.social.wechatQr, '/img/wechat-qr.webp') +
      field('QQ 二维码', 'qqQr', cfg.social && cfg.social.qqQr, '/img/qq-qr.webp');
  } else if (settingsTab === 'home') {
    b.innerHTML = `<div class="field"><label>首页上标</label><input data-k="overline" value="${esc(cfg.home && cfg.home.overline)}"></div>
      <div class="field"><label>入口卡片（JSON）</label><textarea data-json="cards">${esc(JSON.stringify((cfg.home && cfg.home.cards) || [], null, 2))}</textarea></div>`;
  } else if (settingsTab === 'footer') {
    b.innerHTML = `<div class="field"><label>页脚区块（JSON）</label><textarea data-json="footer" style="height:320px">${esc(JSON.stringify((cfg.footer && cfg.footer.columns) || [], null, 2))}</textarea></div>`;
  }
}

$('settingsBody').addEventListener('input', (e) => {
  const t = e.target;
  if (t.dataset.k) {
    const k = t.dataset.k;
    if (k === 'primary') { cfg.theme = cfg.theme || {}; cfg.theme.primary = t.value; }
    else if (k === 'overline') { cfg.home = cfg.home || {}; cfg.home.overline = t.value; }
    else if (k === 'seoDescription') { cfg.seo = cfg.seo || {}; cfg.seo.description = t.value; }
    else cfg[k] = t.value;
  }
  if (t.dataset.nav !== undefined) {
    const i = Number(t.dataset.nav), it = cfg.navbar[i];
    if (t.dataset.f === 'label') it.label = t.value;
    else {
      const v = t.value;
      if (/^https?:/.test(v)) { it.href = v; delete it.to; } else { it.to = v; delete it.href; }
    }
  }
  if (t.dataset.cf) {
    const slug = t.closest('[data-cat]').dataset.cat;
    cfg.categories[slug][t.dataset.cf] = t.value;
  }
  if (t.dataset.json === 'cards') { try { cfg.home = cfg.home || {}; cfg.home.cards = JSON.parse(t.value); } catch {} }
  if (t.dataset.json === 'footer') { try { cfg.footer = {columns: JSON.parse(t.value)}; } catch {} }
});

  if (!b) return;
  if (!confirm('恢复这篇文章到这个版本？')) return;
  const data = await api('/api/history/revert', {method: 'POST', body: JSON.stringify({sha: b.dataset.restore, path: state.current.path})});
  status(data.ok ? '已恢复，记得再点发布' : '恢复失败：' + (data.error || ''), data.ok ? 'ok' : 'err');
  $('modalFileHistory').classList.add('hidden');
  if (data.ok) openDoc(state.current.path);
};

/* ---------- 退出 ---------- */
$('btnLogout').onclick = async () => { await api('/api/logout', {method: 'POST'}); location.reload(); };

/* ---------- 重命名 ---------- */
$('btnRename').onclick = async () => {
  if (!state.current) return;
  const next = prompt('新的文件路径（相对仓库根）', state.current.path);
  if (!next || next === state.current.path) return;
  await api('/api/doc/rename', {method: 'POST', body: JSON.stringify({path: state.current.path, newPath: next})});
  const s = await api('/api/state');
  state.docs = s.docs; state.blog = s.blog;
  renderTree();
  await openDoc(next);
};

boot().catch(() => showLogin(false));
</script>
</body>
</html>
